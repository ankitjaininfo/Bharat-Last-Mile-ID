<script>
/* Reusable, seekable clock for self-contained illustration timelines. */
class IllustrationTimeline {
  constructor({duration, render, onState = () => {}}) {
    this.duration = duration; this.render = render; this.onState = onState;
    this.time = 0; this.playing = false; this.previous = null;
    this.tick = this.tick.bind(this); this.render(0);
  }
  tick(now) {
    if (!this.playing) return;
    if (this.previous !== null) this.time = Math.min(this.duration, this.time + (now-this.previous)/1000);
    this.previous = now; this.render(this.time);
    if (this.time >= this.duration) { this.pause(); return; }
    requestAnimationFrame(this.tick);
  }
  play() { if(this.playing) return; if(this.time >= this.duration) this.time=0; this.playing=true; this.previous=null; this.onState(this); requestAnimationFrame(this.tick); }
  pause() { this.playing=false; this.previous=null; this.onState(this); }
  seek(time) { this.time=Math.max(0,Math.min(this.duration,time)); this.previous=null; this.render(this.time); this.onState(this); }
  replay() { this.pause(); this.seek(0); this.play(); }
}

const $=id=>document.getElementById(id);
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const clamp=x=>Math.max(0,Math.min(1,x));
function reveal(id,t,start,end=99){ const a=clamp((t-start)/.6)*clamp((end-t)/.4); $(id).style.opacity=a; }
function travel(id,t,start,end,points){const p=clamp((t-start)/(end-start)); const total=points.slice(1).map((v,i)=>Math.hypot(v[0]-points[i][0],v[1]-points[i][1]));let d=p*total.reduce((a,b)=>a+b,0),i=0;while(i<total.length-1&&d>total[i])d-=total[i++];const q=total[i]?d/total[i]:0;const x=points[i][0]+(points[i+1][0]-points[i][0])*q,y=points[i][1]+(points[i+1][1]-points[i][1])*q;$(id).setAttribute('transform',`translate(${x} ${y})`);$(id).style.opacity=t>=start&&t<=end?Math.min(clamp((t-start)/.25),clamp((end-t)/.25)):0;}
// Each cue follows the preceding action so speed edits propagate through the film.
const cues={issueStart:2.2,issueDuration:5.8/(1.25*1.25)};
cues.qr=cues.issueStart+cues.issueDuration;
cues.zoomIn=cues.qr;
cues.scan=cues.zoomIn+1.6;
cues.capture=cues.scan+.4;
cues.zoomOut=cues.capture+3;
cues.verified=cues.zoomOut+2;
cues.dataStart=cues.verified+2.5;
cues.dataEnd=cues.dataStart+3;
cues.form=cues.dataEnd;
cues.trusted=cues.form+2.4;
cues.end=cues.trusted+4.1;
function render(t){
 reveal('pickup',t,1);reveal('pickup-note',t,2.4);reveal('issue-path',t,cues.issueStart-.4,cues.qr+.4);
 const pickupFlash=Math.sin(Math.PI*clamp((t-1.4)/1));
 const pickupScale=1+.045*pickupFlash;
 $('pickup').setAttribute('transform',`translate(104 213) scale(${pickupScale}) translate(-104 -213)`);
 $('pickup-badge').setAttribute('stroke-opacity',pickupFlash);
 $('pickup-badge').setAttribute('fill',`rgb(${Math.round(233-40*pickupFlash)} ${Math.round(237-5*pickupFlash)} ${Math.round(243-30*pickupFlash)})`);
 const {issueStart,issueDuration}=cues, issueEnd=cues.qr;
 const issueProgress=clamp((t-issueStart)/issueDuration);
 const issuePoint=$('issuance-route').getPointAtLength(issueProgress*$('issuance-route').getTotalLength());
 $('pass-packet').setAttribute('transform',`translate(${issuePoint.x} ${issuePoint.y})`);
 $('pass-packet').style.opacity=t>=issueStart&&t<=issueEnd?Math.min(clamp((t-issueStart)/.25),clamp((issueEnd-t)/.25)):0;
 reveal('phone-pass',t,issueEnd);$('phone-wait').style.opacity=1-clamp((t-(issueEnd-.3))/.5);
 const zoom=ease(clamp((t-cues.zoomIn)/1.4))*(1-ease(clamp((t-cues.zoomOut)/1.4)));
 $('phone-focus').setAttribute('transform',`translate(${650-10*zoom} ${395-125*zoom}) scale(${.75+.85*zoom})`);
 $('reader-device').setAttribute('transform',`translate(${1030-90*zoom} ${444-127.6*zoom}) scale(${.62+.78*zoom})`);
 for(const id of ['rider','guard','entry-form'])$(id).style.opacity=1-.8*zoom;
 $('hand-grip').style.opacity=1-zoom;
 reveal('scan-logo',t,cues.scan,cues.zoomOut+1.4); $('scan-logo').style.opacity=Number($('scan-logo').style.opacity)*zoom;
 reveal('scan',t,cues.scan,cues.capture+2.8);
 const captured=clamp((t-cues.capture)/2.2);
 $('scan-line').setAttribute('d',`M15 ${77+112*captured}h109`);
 $('capture-extent').setAttribute('height',76*captured);
 $('reader-scan-line').setAttribute('transform',`translate(0 ${76*captured})`);
 $('captured-qr').style.opacity=1-clamp((t-(cues.verified-.5))/.5);
 reveal('scan-connection',t,cues.capture,cues.capture+2.7);
 reveal('reader-verified',t,cues.verified);$('reader-camera').style.opacity=1-clamp((t-cues.verified)/.5);
 reveal('data-path',t,cues.dataStart-.5,cues.dataEnd+1);
 travel('data-packet',t,cues.dataStart,cues.dataEnd,[[1104,494],[1154,494]]);
 reveal('field-name',t,cues.form);reveal('field-issuer',t,cues.form+.6);reveal('field-destination',t,cues.form+1.2);reveal('approval',t,cues.trusted);
 $('placeholder').style.opacity=1-clamp((t-cues.form)/.6);
}
const clock=new IllustrationTimeline({duration:cues.end,render,onState:c=>{ $('pause-text').textContent=c.playing?'Pause':c.time>=cues.end?'Play':'Resume';$('pause').setAttribute('aria-label',c.playing?'Pause animation':'Play animation');$('pause-icon').setAttribute('d',c.playing?'M5 3v10M11 3v10':'m5 3 7 5-7 5Z'); }});
$('pause').onclick=()=>clock.playing?clock.pause():clock.play();$('replay').onclick=()=>clock.replay();
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();clock.playing?clock.pause():clock.play();}});
window.illustration={cues:Object.freeze({...cues}),seek:t=>{clock.pause();clock.seek(t)},play:()=>clock.play(),pause:()=>clock.pause(),replay:()=>clock.replay(),get time(){return clock.time},duration:cues.end};
if(matchMedia('(prefers-reduced-motion: reduce)').matches){clock.seek(cues.end);clock.pause()}else clock.play();
</script></body></html>
